name: unzip-v37
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download zip from temp release and replace folder
        run: |
          set -e
          curl -L -o da-qia-wen-an-v37.zip https://github.com/andyju998/TVBox_live/releases/download/v37-temp/da-qia-wen-an-v37.zip
          ls -la da-qia-wen-an-v37.zip
          echo "610b8408ded0b90e19476b2488c1e348b59dbbd3f1250bd3a38a75aecbd9c906  da-qia-wen-an-v37.zip" | sha256sum -c -
          rm -rf /tmp/v37 && mkdir -p /tmp/v37
          unzip -o da-qia-wen-an-v37.zip -d /tmp/v37
          echo "extracted files: $(find /tmp/v37/da-qia-wen-an -type f | wc -l)"
          rm -rf da-qia-wen-an
          mv /tmp/v37/da-qia-wen-an ./da-qia-wen-an
          rm -f da-qia-wen-an-v37.zip
          rm -f .github/workflows/unzip-v37.yml
          echo "tuku: $(find da-qia-wen-an/assets/tuku -maxdepth 1 -type f | wc -l)"
          echo "th: $(find da-qia-wen-an/assets/tuku/th -maxdepth 1 -type f | wc -l)"
          echo "sm: $(find da-qia-wen-an/assets/tuku/sm -maxdepth 1 -type f | wc -l)"
      - name: Commit and push
        run: |
          git config user.name "andyju998"
          git config user.email "andyju998@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "更新打卡文案至 v37（图库 125 张）" || echo "nothing to commit"
          git push
      - name: Delete temp release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RID=$(gh api repos/andyju998/TVBox_live/releases/tags/v37-temp --jq .id) || true
          if [ -n "$RID" ]; then gh api -X DELETE "repos/andyju998/TVBox_live/releases/$RID" || true; fi
          git push origin :refs/tags/v37-temp || true
