<style>
*{box-sizing:border-box}
body{margin:0;background:#ededed;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;color:#22302a}
.card{max-width:480px;margin:0 auto;background:#fffdf8;padding:20px 18px 28px}
.date{text-align:center;color:#7a8a7f;font-size:14px;margin:0}
h1{text-align:center;font-size:24px;font-weight:400;margin:6px 0 0}
.emos{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.emo{width:32px;height:32px;border-radius:6px;object-fit:cover}
.emo-t{font-size:20px;line-height:32px}
.fu{display:inline-flex;width:24px;height:24px;transform:rotate(45deg);background:#d43d2a;border-radius:3px;align-items:center;justify-content:center;margin:0 2px}
.fu span{transform:rotate(-45deg);color:#fff;font-weight:700;font-size:14px}
.txt{white-space:pre-wrap;font-size:18px;line-height:1.75;margin:10px 0 0}
.grid{display:grid;gap:4px;margin-top:10px}
.cell{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:4px;background:#e6ede4}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cell video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;pointer-events:none}
.dur{position:absolute;right:4px;top:4px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
.nolabel{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);color:#fff;font-size:11px;text-align:center;padding:3px 0}
#lb{position:fixed;inset:0;background:#000;z-index:9;display:flex;flex-direction:column}
#lb[hidden]{display:none}
.lb-top{display:flex;justify-content:space-between;align-items:center;color:rgba(255,255,255,.85);padding:14px 16px;font-size:14px;font-family:sans-serif}
.lb-top button{background:none;border:none;color:#fff;font-size:26px;line-height:1;padding:4px 10px}
#lb-img{flex:1;min-height:0;width:100%;object-fit:contain}
.lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:none;background:rgba(0,0,0,.4);color:#fff;font-size:26px}
.lb-prev{left:8px}
.lb-next{right:8px}

<body>
<main class="card">
<p class="date">2026年11月12日　周四 · 晴</p>
<h1>一顿热乎的晚饭</h1>

<p class="txt">下午泡了壶茶，翻了翻旧相册。晚上自己做了顿热乎饭，厨房里雾气腾腾的，窗外天都黑了。这样平平常常的一天，也值得记下来。</p>
<div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="cell vid" onclick="playVid(this)"><img src="s11.jpg" alt=""><span class="play">▶</span><span class="dur">0:10</span><video src="v11.mp4" controls playsinline preload="metadata" style="display:none"></video></div><div class="cell"><img src="p2.jpg" alt="" onclick="openLb(0)"></div><div class="cell"><img src="p3.jpg" alt="" onclick="openLb(1)"></div><div class="cell"><img src="p4.jpg" alt="" onclick="openLb(2)"></div><div class="cell"><img src="p5.jpg" alt="" onclick="openLb(3)"></div><div class="cell"><img src="p6.jpg" alt="" onclick="openLb(4)"></div><div class="cell"><img src="p7.jpg" alt="" onclick="openLb(5)"></div><div class="cell"><img src="p8.jpg" alt="" onclick="openLb(6)"></div><div class="cell"><img src="p9.jpg" alt="" onclick="openLb(7)"></div></div>
</main>
<div id="lb" hidden>
<div class="lb-top"><span id="lb-n"></span><button type="button" onclick="closeLb()" aria-label="关闭">×</button></div>
<img id="lb-img" alt="">
<button type="button" class="lb-prev" onclick="navLb(-1)" aria-label="上一张">‹</button>
<button type="button" class="lb-next" onclick="navLb(1)" aria-label="下一张">›</button>
</div>
<script>
var PHOTOS = ["p2.jpg","p3.jpg","p4.jpg","p5.jpg","p6.jpg","p7.jpg","p8.jpg","p9.jpg"];
var cur = 0;
function showLb(){document.getElementById('lb-img').src=PHOTOS[cur];document.getElementById('lb-n').textContent=(cur+1)+' / '+PHOTOS.length;}
function openLb(i){cur=i;showLb();document.getElementById('lb').hidden=false;}
function closeLb(){document.getElementById('lb').hidden=true;}
function navLb(dd){cur=Math.min(PHOTOS.length-1,Math.max(0,cur+dd));showLb();}
function playVid(cell){var v=cell.querySelector('video');if(!v)return;var im=cell.querySelector('img');if(im)im.style.display='none';var p=cell.querySelector('.play');if(p)p.style.display='none';var du=cell.querySelector('.dur');if(du)du.style.display='none';v.style.display='block';v.play();}
var tx=null;
var lbEl=document.getElementById('lb');
lbEl.addEventListener('touchstart',function(e){tx=e.touches[0].clientX;});
lbEl.addEventListener('touchend',function(e){if(tx===null)return;var dx=e.changedTouches[0].clientX-tx;tx=null;if(dx<-50)navLb(1);if(dx>50)navLb(-1);});
document.getElementById('lb-img').addEventListener('click',closeLb);
</script>

</body>
