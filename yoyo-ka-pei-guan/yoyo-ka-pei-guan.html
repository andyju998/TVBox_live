<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>YOYO 咖啡馆</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@900&display=swap"
      rel="stylesheet"
    />
    <style>
      button { min-height: 2rem; }
      * { box-sizing: border-box; }
      body { margin: 0; }

      /* YOYO 咖啡馆公开版（静态）— 版式与原版一致：首图居中 1028px 与下方内容边框对齐，
         标题在左、时间天气小条在标题同一行右边（深绿 #24503c）；三端布局分开，互不影响。 */
      .cafe {
        --cafe-bg: #faf5ea;
        --cafe-card: #fffdf7;
        --cafe-ink: #2f2a22;
        --cafe-line: #e2d5bd;
        --cafe-sage: #5f7a64;
        --cafe-terra: #bc6a48;
        --cafe-shadow: 0 10px 30px rgba(80, 60, 30, 0.14);
        background: var(--cafe-bg);
        color: var(--cafe-ink);
        font-family: "Noto Sans SC", system-ui, sans-serif;
        line-height: 1.6;
        min-height: 100vh;
      }
      @media (prefers-color-scheme: dark) {
        .cafe {
          --cafe-bg: #1e1b16;
          --cafe-card: #2b2720;
          --cafe-ink: #f2e9d8;
          --cafe-line: #433b2f;
          --cafe-sage: #9db8a2;
          --cafe-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
      }
      .cafe h1, .cafe .scenes-title { font-family: "Noto Serif SC", serif; }
      .cafe img { display: block; max-width: 100%; }

      /* ---- 首图 ---- */
      .cafe .hero-frame {
        position: relative;
        width: min(1028px, calc(100% - 32px));
        margin: 24px auto 0;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: var(--cafe-shadow);
        border: 1px solid var(--cafe-line);
        transform: perspective(1200px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
        transition: transform 0.35s ease;
        animation: cafe-rise 0.5s ease backwards;
      }
      @media (min-width: 1024px) and (hover: hover) and (pointer: fine) {
        .cafe .hero-frame { margin-top: 61px; }
      }
      .cafe .hero-frame img {
        width: 100%;
        height: auto;
        transition: filter 0.6s ease, opacity 0.3s ease;
        transform: scale(1.07) translateY(var(--py, 0px));
        will-change: transform;
      }
      .cafe .hero-frame img.fading { opacity: 0; }
      .cafe .hero-frame[data-time="morning"] img { filter: brightness(1.06) saturate(1.02); }
      .cafe .hero-frame[data-time="afternoon"] img { filter: brightness(1) saturate(1.05); }
      .cafe .hero-frame[data-time="evening"] img { filter: brightness(0.82) sepia(0.28) saturate(1.1); }
      /* 首图右下角天气小条：贴底贴右，白色 18% 半透明蒙层、无模糊，与场景名标签同款 */
      .cafe .hero-badge {
        position: absolute;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.18);
        color: #ffeec2;
        padding: 8px 14px;
        border: 1px solid transparent;
        border-radius: 999px;
        font-size: 13px;
        font-family: "Noto Sans SC", system-ui, sans-serif;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45), 0 0 10px rgba(0, 0, 0, 0.18);
        transform: translateY(calc(var(--py, 0px) * -0.6));
      }

      /* ---- 标题行 ---- */
      .cafe .wrap { max-width: 1060px; margin: 0 auto; padding: 0 16px 64px; }
      .cafe .hero-title {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding: 28px 0 2px;
        text-align: left;
      }
      .cafe .hero-title h1 {
        font-size: clamp(32px, 6vw, 48px);
        font-weight: 900;
        line-height: 1.25;
        margin: 0;
      }
      .cafe .nowbar {
        display: flex;
        gap: 10px;
        justify-content: flex-start;
        align-items: center;
        flex-wrap: nowrap;
        margin: 0 1.2cm 6px;
        margin-left: auto;
      }
      .cafe .nowbar .pill {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: #24503c;
        color: #eaf3e4;
        border: 1px solid #24503c;
        border-radius: 999px;
        padding: 7px 16px;
        font-size: 14px;
        box-shadow: 0 4px 14px rgba(36, 80, 60, 0.22);
      }
      .cafe .nowbar .pill b { font-variant-numeric: tabular-nums; font-weight: 700; }
      .cafe .nowbar .pill .city { color: #bcd3bd; font-size: 13px; }
      @media (prefers-color-scheme: dark) {
        .cafe .nowbar .pill { background: #2c5c46; border-color: #2c5c46; }
      }
      /* 平板：标题居中，时间天气移到标题下方居中一排 */
      @media (min-width: 641px) and (max-width: 1366px) and (pointer: coarse) {
        .cafe .hero-title {
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          gap: 10px;
          padding-top: calc(22px - 4mm);
        }
        .cafe .hero-title h1 {
          text-align: center;
          font-size: clamp(30px, 5vw, 42px);
          transform: translateY(-1.5mm);
        }
        .cafe .nowbar {
          margin: calc(2px - 2mm) auto calc(6px + 2mm);
          justify-content: center;
          flex-wrap: nowrap;
          align-items: flex-end;
        }
        .cafe .nowbar .pill { padding: 6px 13px; white-space: nowrap; }
      }
      @media (min-width: 641px) and (max-width: 1366px) and (orientation: portrait) {
        .cafe .hero-title { margin-top: 3mm; margin-bottom: -3mm; }
        .cafe .scenes-block { margin-top: -10mm; }
        .cafe .scenes-title {
          margin-top: calc(30px + 4mm);
          margin-bottom: calc(2px - 4mm);
        }
      }
      @media (max-width: 640px) {
        .cafe .hero-title { gap: 8px; padding-top: calc(28px - 3mm); }
        .cafe .hero-title h1 {
          flex: 0 0 100%;
          text-align: center;
          font-size: 26px;
          margin-top: -1mm;
          margin-bottom: 1mm;
        }
        .cafe .nowbar { margin: 0 auto 6px; justify-content: center; gap: 6px; }
        .cafe .nowbar .pill { padding: 5px 10px; font-size: 12px; gap: 5px; white-space: nowrap; }
        .cafe .nowbar .pill .city { font-size: 11px; }
      }

      /* ---- 时段切换 ---- */
      .cafe .time-switch {
        display: flex;
        gap: 8px;
        justify-content: flex-start;
        margin: 14px 0 6px;
        flex-wrap: wrap;
      }
      .cafe .time-switch button {
        min-height: 40px;
        padding: 8px 18px;
        border-radius: 999px;
        border: 1px solid var(--cafe-line);
        background: var(--cafe-card);
        color: var(--cafe-ink);
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
      }
      .cafe .time-switch button.on {
        background: var(--cafe-sage);
        color: #fff;
        border-color: var(--cafe-sage);
      }
      @media (max-width: 640px) {
        .cafe .time-switch {
          justify-content: center;
          margin-top: calc(14px - 2mm);
          margin-bottom: calc(6px + 2mm);
        }
      }
      @media (min-width: 641px) and (max-width: 1366px) and (pointer: coarse) {
        .cafe .time-switch {
          justify-content: center;
          margin-top: calc(14px + 2mm);
          margin-bottom: calc(6px - 2mm);
        }
      }
      @media (min-width: 641px) and (max-width: 1366px) and (orientation: portrait) {
        .cafe .time-switch { margin-top: 14px; margin-bottom: 6px; }
      }

      /* ---- 九个场景 ---- */
      .cafe .scenes-title {
        font-weight: 900;
        font-size: clamp(22px, 4.5vw, 30px);
        margin: 30px 0 2px;
      }
      @media (max-width: 640px) {
        .cafe .scenes-block { margin-top: -9mm; }
        .cafe .scenes-title {
          margin-top: calc(30px + 2mm);
          margin-bottom: calc(2px - 2mm);
          margin-left: 3mm;
        }
      }
      @media (min-width: 641px) and (max-width: 1366px) and (orientation: portrait) {
        .cafe .scenes-title { margin-left: 2.5mm; }
      }
      @media (min-width: 641px) and (max-width: 1366px) and (pointer: coarse) and (orientation: landscape) {
        .cafe .scenes-title { margin-left: 2.5mm; }
      }
      .cafe .scenes {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        margin-top: 14px;
        position: relative;
      }
      .cafe .scene-card {
        padding: 0;
        border: 1px solid var(--cafe-line);
        border-radius: 18px;
        overflow: hidden;
        background: var(--cafe-card);
        cursor: pointer;
        box-shadow: var(--cafe-shadow);
        text-align: left;
        width: 100%;
        min-height: 44px;
        font-family: inherit;
        touch-action: pan-y;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        animation: cafe-rise 0.5s ease backwards;
      }
      .cafe .scene-card figure { margin: 0; position: relative; overflow: hidden; }
      .cafe .scene-card img {
        width: 100%;
        aspect-ratio: 4 / 3;
        object-fit: cover;
        pointer-events: none;
      }
      .cafe .scene-card.on { outline: 3px solid var(--cafe-terra); outline-offset: -1px; }
      /* 场景名标签：与首图天气小条同一套蒙层（白 18% 半透明、无模糊、透明边框、999px 圆角） */
      .cafe .scene-name {
        position: absolute;
        left: 12px;
        bottom: 12px;
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid transparent;
        border-radius: 999px;
        color: #ffeec2;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45), 0 0 10px rgba(0, 0, 0, 0.18);
        font-weight: 900;
        font-size: 13px;
        padding: 1px 6px;
      }
      .cafe .scenes.is-dragging .scene-card { animation: none; will-change: transform; }
      .cafe .scene-card.dragging {
        opacity: 0.95;
        box-shadow: 0 18px 44px rgba(60, 42, 18, 0.35);
        z-index: 5;
        will-change: transform;
      }
      @media (min-width: 720px) {
        .cafe .scenes { grid-template-columns: 1fr 1fr; }
        .cafe .scene-card.wide { grid-column: 1 / -1; }
        .cafe .scene-card.wide img { aspect-ratio: 16 / 8; }
      }

      /* ---- 菜单 ---- */
      .cafe .menu {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 28px;
        background: var(--cafe-card);
        border: 1px solid var(--cafe-line);
        border-radius: 18px;
        padding: 20px 22px;
        margin-top: 14px;
        content-visibility: auto;
        contain-intrinsic-size: auto 260px;
      }
      .cafe .menu div {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px dashed var(--cafe-line);
        padding: 9px 0;
        font-size: 15px;
      }
      .cafe .menu div span:last-child { color: var(--cafe-terra); font-weight: 700; }
      @media (max-width: 720px) {
        .cafe .menu { grid-template-columns: 1fr; }
      }

      @keyframes cafe-rise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .cafe * {
          transition: none !important;
          animation: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>

      var byId = {};
      SCENES.forEach(function (s) { byId[s.id] = s; });

      /* ---------- 时段 ---------- */

      var SEG_LABEL = { morning: "上午", afternoon: "午后", evening: "傍晚" };
      var SEG_CAPTION = {

        afternoon: "阳光落在转角上",
        evening: "亮灯了，店里暖起来"
      };
      function segForHour(h) { return h < 11 ? "morning" : h < 17 ? "afternoon" : "evening"; }
      var manualSeg = null;
      var seg = segForHour(new Date().getHours());

      var heroFrame = document.getElementById("heroFrame");
      var heroImg = document.getElementById("heroImg");
      var heroBadge = document.getElementById("heroBadge");
      var segButtons = Array.prototype.slice.call(document.querySelectorAll(".time-switch button"));

      function applySeg() {
        heroFrame.setAttribute("data-time", seg);
        segButtons.forEach(function (b) {
          var on = b.getAttribute("data-seg") === seg;
          b.classList.toggle("on", on);
          b.setAttribute("aria-pressed", on ? "true" : "false");
        });
        updateBadge();
      }
      segButtons.forEach(function (b) {
        b.addEventListener("click", function () {
          manualSeg = b.getAttribute("data-seg");
          seg = manualSeg;
          applySeg();
        });
      });
      setInterval(function () {
        if (manualSeg) return;
        var s = segForHour(new Date().getHours());
        if (s !== seg) { seg = s; applySeg(); }
      }, 20000);

      /* ---------- 时钟（只更新小条里的文字，不带动整页） ---------- */
      var clockEl = document.getElementById("clock");
      var dateEl = document.getElementById("dateline");
      function tickClock() {
        var now = new Date();
        clockEl.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());

      }
      tickClock();
      setInterval(tickClock, 1000);

      /* ---------- 天气（Open-Meteo；定位跟随，取不到退回上海；每 30 分钟刷新） ---------- */
      var WMO = {
        0: ["☀️", "晴"], 1: ["🌤️", "多云"], 2: ["⛅", "多云"], 3: ["☁️", "阴"],
        45: ["🌫️", "雾"], 48: ["🌫️", "雾凇"], 51: ["🌦️", "小毛毛雨"], 53: ["🌦️", "毛毛雨"],
        55: ["🌦️", "毛毛雨"], 56: ["🌧️", "冻毛毛雨"], 57: ["🌧️", "冻毛毛雨"],
        61: ["🌧️", "小雨"], 63: ["🌧️", "中雨"], 65: ["🌧️", "大雨"], 66: ["🌧️", "冻雨"],
        67: ["🌧️", "冻雨"], 71: ["🌨️", "小雪"], 73: ["🌨️", "中雪"], 75: ["🌨️", "大雪"],
        77: ["🌨️", "雪粒"], 80: ["🌦️", "阵雨"], 81: ["🌧️", "阵雨"], 82: ["🌧️", "暴雨阵雨"],
        85: ["🌨️", "阵雪"], 86: ["🌨️", "阵雪"], 95: ["⛈️", "雷阵雨"],
        96: ["⛈️", "雷阵雨伴冰雹"], 99: ["⛈️", "雷阵雨伴冰雹"]
      };
      var wx = null;
      var wxFailed = false;
      var wxPill = document.getElementById("wxPill");

      function renderWx() {
        if (wx) {
          wxPill.innerHTML = "";
          wxPill.appendChild(document.createTextNode(wx.icon + " "));
          var b = document.createElement("b");
          b.textContent = wx.temp + "°C";
          wxPill.appendChild(b);
          wxPill.appendChild(document.createTextNode(" " + wx.label));
          if (wx.city) {
            var c = document.createElement("span");
            c.className = "city";
            c.textContent = wx.city;
            wxPill.appendChild(c);
          }
        } else if (wxFailed) {
          wxPill.textContent = "🌡️ 天气暂时取不到";
        }
        updateBadge();
      }
      function updateBadge() {
        if (wx) {
          heroBadge.textContent = SEG_ICON[seg] + " " + SEG_LABEL[seg] + " · " + wx.label + " " + wx.temp + "°C" +
            (/雨|雹/.test(wx.label) ? "，适合来杯咖啡" : "");
        } else {
          heroBadge.textContent = SEG_ICON[seg] + " " + SEG_LABEL[seg] + " · " + SEG_CAPTION[seg];
        }
      }

      (function initWeather() {
        var timer = null;
        var generation = 0;
        var settled = null;
        function load(lat, lon, city) {
          var url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat +
            "&longitude=" + lon + "&current=temperature_2m,weather_code&timezone=auto";
          fetch(url).then(function (r) { return r.json(); }).then(function (j) {
            if (!j || !j.current) return;
            var w = WMO[j.current.weather_code] || ["🌡️", "—"];
            wx = { icon: w[0], label: w[1], temp: Math.round(j.current.temperature_2m), city: city };
            wxFailed = false;
            renderWx();
          }).catch(function () {
            wxFailed = true;
            renderWx();
          });
        }
        function begin(lat, lon, city) {
          if (timer !== null) window.clearInterval(timer);
          load(lat, lon, city);
          timer = window.setInterval(function () { load(lat, lon, city); }, 30 * 60 * 1000);
        }
        function start(lat, lon, realPosition) {
          if (settled && Math.abs(settled.lat - lat) < 0.01 && Math.abs(settled.lon - lon) < 0.01) return;
          settled = { lat: lat, lon: lon };
          var gen = ++generation;
          var fallbackCity = realPosition ? "" : "上海";
          fetch("https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=" + lat +
            "&longitude=" + lon + "&localityLanguage=zh")
            .then(function (r) { return r.json(); })
            .then(function (j) {
              if (gen !== generation) return;
              var city = ((j && j.city) || "").trim();
              if (city.length > 2 && city.charAt(city.length - 1) === "市") city = city.slice(0, -1);
              begin(lat, lon, city || fallbackCity);
            })
            .catch(function () {
              if (gen === generation) begin(lat, lon, fallbackCity);
            });
        }
        if (navigator.geolocation) {
          navigator.geolocation.watchPosition(
            function (p) {
              start(Number(p.coords.latitude.toFixed(4)), Number(p.coords.longitude.toFixed(4)), true);
            },
            function () {
              if (!settled) start(31.2304, 121.4737, false);
            },
            { timeout: 10000, maximumAge: 60000 }
          );
        } else {
          start(31.2304, 121.4737, false);
        }
      })();

      /* ---------- 场景卡片 ---------- */
      var scenesEl = document.getElementById("scenes");
      var cardEls = {};
      var activeId = "hero";
      var suppressClick = false;
      var dragActive = false;

      function buildCards() {
        scenesEl.innerHTML = "";
        cardEls = {};
        order.forEach(function (id, idx) {
          var s = byId[id];
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "scene-card" + (s.wide ? " wide" : "") + (id === activeId ? " on" : "");
          btn.setAttribute("data-scene-id", id);
          btn.style.animationDelay = Math.min(idx, 8) * 40 + "ms";
          btn.setAttribute("aria-label", s.name + "，点按换到上方大图，长按拖动换位置");
          var fig = document.createElement("figure");
          var img = document.createElement("img");
          img.src = "assets/" + id + "-thumb.webp";
          img.srcset = "assets/" + id + "-thumb480.webp 480w, assets/" + id + "-thumb.webp " + s.thumbW + "w";
          img.sizes = s.wide
            ? "(max-width:1060px) calc(100vw - 32px), 1028px"
            : "(max-width:719px) calc(100vw - 32px), (max-width:1060px) calc(50vw - 24px), 506px";
          img.alt = s.alt;
          img.width = s.thumbW;
          img.height = s.thumbH;
          img.loading = "eager";
          if (idx < 4) img.setAttribute("fetchpriority", "high");
          img.decoding = "async";
          img.draggable = false;
          var label = document.createElement("span");
          label.className = "scene-name";
          label.textContent = s.name;
          fig.appendChild(img);
          fig.appendChild(label);
          btn.appendChild(fig);
          btn.addEventListener("pointerdown", function (e) { onCardPointerDown(e, id); });
          btn.addEventListener("click", function () { onCardClick(id); });
          scenesEl.appendChild(btn);
          cardEls[id] = btn;
        });
      }
      buildCards();

      /* ---------- 菜单 ---------- */
      var menuEl = document.getElementById("menu");
      MENU.forEach(function (item) {
        var row = document.createElement("div");
        var a = document.createElement("span"); a.textContent = item[0];
        var b = document.createElement("span"); b.textContent = item[1];
        row.appendChild(a); row.appendChild(b);
        menuEl.appendChild(row);
      });

      /* ---------- 上方大图切换（约 300ms 淡入淡出） ---------- */
      var fadeTimer = null;
      function showScene(id) {
        if (id === activeId) return;
        activeId = id;
        var s = byId[id];
        heroImg.classList.add("fading");
        window.clearTimeout(fadeTimer);
        fadeTimer = window.setTimeout(function () {
          heroImg.src = "assets/" + id + ".webp";
          heroImg.srcset = "assets/" + id + "-thumb480.webp 480w, assets/" + id + "-768.webp 768w, assets/" + id + ".webp 1280w";
          heroImg.alt = id === "hero" ? "YOYO 咖啡馆门面全景" : s.alt;
          heroImg.height = s.fullH;
          heroImg.classList.remove("fading");
        }, 160);
        Object.keys(cardEls).forEach(function (cid) {
          cardEls[cid].classList.toggle("on", cid === id);
        });
      }
      function onCardClick(id) {
        if (suppressClick) return;
        showScene(id);
        heroFrame.scrollIntoView({ behavior: "smooth", block: "center" });
      }

      /* ---------- 首图轻分层视差 + 微倾（拖动期间暂停） ---------- */
      (function initParallax() {
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var ticking = false;
        function update() {
          ticking = false;
          if (dragActive) return;
          var r = heroFrame.getBoundingClientRect();
          var vh = window.innerHeight;
          if (r.bottom < -80 || r.top > vh + 80) return;
          var off = (r.top + r.height / 2 - vh / 2) * 0.022;
          if (off > 18) off = 18;
          if (off < -18) off = -18;
          heroFrame.style.setProperty("--py", (-off).toFixed(1) + "px");
        }
        window.addEventListener("scroll", function () {
          if (!ticking) { ticking = true; requestAnimationFrame(update); }
        }, { passive: true });
        window.addEventListener("resize", function () {
          if (!ticking) { ticking = true; requestAnimationFrame(update); }
        });
        heroFrame.addEventListener("pointermove", function (e) {
          if (dragActive) return;
          var r = heroFrame.getBoundingClientRect();
          var dx = (e.clientX - r.left) / r.width - 0.5;
          var dy = (e.clientY - r.top) / r.height - 0.5;
          heroFrame.style.setProperty("--ry", (dx * 2.4).toFixed(2) + "deg");
          heroFrame.style.setProperty("--rx", (-dy * 2.4).toFixed(2) + "deg");
        });
        heroFrame.addEventListener("pointerleave", function () {
          heroFrame.style.setProperty("--rx", "0deg");
          heroFrame.style.setProperty("--ry", "0deg");
        });
        update();
      })();

      /* ---------- 空闲预加载其余场景大图（三路并行、低优先级） ---------- */
      (function preload() {
        var conn = navigator.connection;
        if (conn && (conn.saveData || /2g/.test(conn.effectiveType || ""))) return;
        var small = window.matchMedia("(max-width:1060px)").matches;
        var urls = order.filter(function (id) { return id !== "hero"; }).map(function (id) {
          return "assets/" + id + (small ? "-768.webp" : ".webp");
        });
        var i = 0;
        function loadOne(url) {
          return new Promise(function (resolve) {
            var im = new Image();
            im.decoding = "async";
            try { im.fetchPriority = "low"; } catch (e) {}
            im.onload = function () { resolve(); };
            im.onerror = function () { resolve(); };
            im.src = url;
          });
        }
        function worker() {
          if (i >= urls.length) return;
          var url = urls[i++];
          loadOne(url).then(worker);
        }
        window.setTimeout(function () { worker(); worker(); worker(); }, 500);
      })();

      /* ---------- 拖动排序（顺序只在本次打开期间有效，刷新恢复定版顺序） ----------
         鼠标移动超过 6px 提起；触摸长按约 200ms 提起，快速滑动仍是翻页。
         监听挂在 window 上；格位提起时量一次缓存，拖动中逐帧只写被拖卡片的 transform。 */
      var drag = null;

      function preventTouchMove(e) { e.preventDefault(); }

      function applyGlue() {
        if (!drag || !drag.active) return;
        var el = cardEls[drag.id];
        if (!el) return;
        var idx = drag.order.indexOf(drag.id);
        var slot = drag.slots[idx];
        var origin = drag.slots[drag.originIndex];
        if (!slot || !origin) return;
        var dx = origin.l - slot.l + (drag.lastClientX + window.scrollX - drag.startPageX);
        var dy = origin.t - slot.t + (drag.lastClientY + window.scrollY - drag.startPageY);
        el.style.transform = "translate3d(" + dx + "px, " + dy + "px, 0) scale(1.03)";
      }

      function renderDragOrder(deltas) {
        /* 按 drag.order 重排 DOM，并对让位卡片回放 FLIP 位移 */
        var first = {};
        if (deltas) {
          Object.keys(deltas).forEach(function (cid) {
            var el = cardEls[cid];
            if (el) first[cid] = el.getBoundingClientRect();
          });
        }
        drag.order.forEach(function (id) { scenesEl.appendChild(cardEls[id]); });
        if (deltas) {
          var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var flips = [];
          Object.keys(deltas).forEach(function (cid) {
            var el = cardEls[cid];
            if (!el || !first[cid]) return;
            var now = el.getBoundingClientRect();
            var dx = first[cid].left - now.left;
            var dy = first[cid].top - now.top;
            if (dx === 0 && dy === 0) return;
            el.style.transition = "none";
            el.style.transform = "translate3d(" + dx + "px, " + dy + "px, 0)";
            flips.push(el);
          });
          void scenesEl.offsetWidth;
          flips.forEach(function (el) {
            el.style.transition = reduced ? "none" : "transform 160ms cubic-bezier(0.25, 0.8, 0.35, 1)";
            el.style.transform = "";
            window.setTimeout(function () { el.style.transition = ""; }, 200);
          });
        }
        applyGlue();
      }

      function retarget() {
        if (!drag || !drag.active) return;
        var from = drag.order.indexOf(drag.id);
        var self = drag.slots[from];
        if (from < 0 || !self) return;
        var cx = drag.lastClientX + window.scrollX + drag.centerShiftX - drag.containerPageLeft;
        var cy = drag.lastClientY + window.scrollY + drag.centerShiftY - drag.containerPageTop;
        if (cx >= self.l && cx <= self.l + self.w && cy >= self.t && cy <= self.t + self.h) return;
        var to = -1;
        var bestDist = Infinity;
        drag.slots.forEach(function (s, i) {
          if (i === from) return;
          var ddx = cx < s.l ? s.l - cx : cx > s.l + s.w ? cx - (s.l + s.w) : 0;
          var ddy = cy < s.t ? s.t - cy : cy > s.t + s.h ? cy - (s.t + s.h) : 0;
          var dist = ddx * ddx + ddy * ddy;
          if (dist < bestDist) { bestDist = dist; to = i; }
        });
        if (to < 0 || to === from) return;
        var next = drag.order.slice();
        next.splice(from, 1);
        next.splice(to, 0, drag.id);
        var deltas = {};
        next.forEach(function (cid, newIdx) {
          if (cid === drag.id) return;
          var oldIdx = drag.order.indexOf(cid);
          var os = drag.slots[oldIdx];
          var ns = drag.slots[newIdx];
          if (os && ns && (os.l !== ns.l || os.t !== ns.t)) deltas[cid] = true;
        });
        drag.order = next;
        renderDragOrder(deltas);
      }

      function frameTick() {
        if (!drag || !drag.active) return;
        var y = drag.lastClientY;
        var vh = window.innerHeight;
        var EDGE = 84;
        var dy = 0;
        if (y < EDGE) dy = -Math.ceil(14 * (1 - y / EDGE));
        else if (y > vh - EDGE) dy = Math.ceil(14 * (1 - (vh - y) / EDGE));
        if (dy !== 0) window.scrollBy(0, dy);
        applyGlue();
        if (drag.moved || dy !== 0) retarget();
        drag.moved = false;
        drag.raf = requestAnimationFrame(frameTick);
      }

      function activateDrag() {
        if (!drag || drag.active || drag.dead) return;
        drag.active = true;
        dragActive = true;
        suppressClick = true;
        var el = drag.el;
        var cRect = scenesEl.getBoundingClientRect();
        drag.containerPageLeft = cRect.left + window.scrollX;
        drag.containerPageTop = cRect.top + window.scrollY;
        drag.slots = drag.order.map(function (cid) {
          var cel = cardEls[cid];
          return cel
            ? { l: cel.offsetLeft, t: cel.offsetTop, w: cel.offsetWidth, h: cel.offsetHeight }
            : { l: 0, t: 0, w: 0, h: 0 };
        });
        drag.originIndex = drag.order.indexOf(drag.id);
        var rect = el.getBoundingClientRect();
        drag.centerShiftX = rect.left + rect.width / 2 - drag.lastClientX;
        drag.centerShiftY = rect.top + rect.height / 2 - drag.lastClientY;
        try { el.setPointerCapture(drag.pointerId); } catch (e) {}
        el.style.touchAction = "none";
        el.style.zIndex = "5";
        if (drag.pointerType === "touch") {
          window.addEventListener("touchmove", preventTouchMove, { passive: false });
        }
        el.classList.add("dragging");
        scenesEl.classList.add("is-dragging");
        applyGlue();
        drag.raf = requestAnimationFrame(frameTick);
      }

      function onCardPointerDown(e, id) {
        if (e.button !== undefined && e.button !== 0) return;
        if (drag) return;
        if (e.pointerType === "mouse") e.preventDefault();
        drag = {
          id: id,
          pointerId: e.pointerId,
          pointerType: e.pointerType,
          el: e.currentTarget,
          startClientX: e.clientX, startClientY: e.clientY,
          lastClientX: e.clientX, lastClientY: e.clientY,
          startPageX: e.clientX + window.scrollX,
          startPageY: e.clientY + window.scrollY,
          slots: [], originIndex: -1,
          containerPageLeft: 0, containerPageTop: 0,
          centerShiftX: 0, centerShiftY: 0,
          active: false, dead: false, moved: false,
          order: order.slice(),
          holdTimer: undefined, raf: undefined
        };
        if (e.pointerType === "touch") {
          drag.holdTimer = window.setTimeout(activateDrag, 200);
        }
      }

      function endDrag(commit) {
        if (!drag) return;
        var d = drag;
        window.clearTimeout(d.holdTimer);
        if (d.raf !== undefined) cancelAnimationFrame(d.raf);
        if (!d.active) { drag = null; return; }
        dragActive = false;
        window.removeEventListener("touchmove", preventTouchMove);
        var el = d.el;
        el.classList.remove("dragging");
        scenesEl.classList.remove("is-dragging");
        if (commit) {
          order = d.order.slice();
          drag = null;
          var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          el.style.transition = reduced ? "none" : "transform 220ms ease";
          el.style.transform = "translate3d(0px, 0px, 0) scale(1)";
          window.setTimeout(function () {
            el.style.transition = "";
            el.style.transform = "";
            el.style.touchAction = "";
            el.style.zIndex = "";
          }, reduced ? 0 : 240);
        } else {
          /* 取消：DOM 按拖动前的顺序排回，被拖卡片样式清掉 */
          order.forEach(function (id) { scenesEl.appendChild(cardEls[id]); });
          drag = null;
          el.style.transform = "";
          el.style.transition = "";
          el.style.touchAction = "";
          el.style.zIndex = "";
        }
        window.setTimeout(function () { suppressClick = false; }, 80);
      }

      window.addEventListener("pointermove", function (e) {
        if (!drag || e.pointerId !== drag.pointerId) return;
        drag.lastClientX = e.clientX;
        drag.lastClientY = e.clientY;
        drag.moved = true;
        if (!drag.active) {
          var dist = Math.hypot(e.clientX - drag.startClientX, e.clientY - drag.startClientY);
          if (drag.pointerType === "touch") {
            if (dist > 10 && !drag.dead) {
              drag.dead = true;
              window.clearTimeout(drag.holdTimer);
            }
            return;
          }
          if (dist > 6) activateDrag();
          return;
        }
        e.preventDefault();
      }, { passive: false });
      window.addEventListener("pointerup", function (e) {
        if (drag && e.pointerId === drag.pointerId) endDrag(true);
      });
      window.addEventListener("pointercancel", function (e) {
        if (!drag || e.pointerId !== drag.pointerId) return;
        if (drag.active) endDrag(false);
        else { window.clearTimeout(drag.holdTimer); drag = null; }
      });
      window.addEventListener("blur", function () {
        if (drag && drag.active) endDrag(false);
        else if (drag) { window.clearTimeout(drag.holdTimer); drag = null; }
      });

      applySeg();
      renderWx();
    </script>
  </body>
</html>
